[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smartsession"
version = "1.0.0"
description = "SmartSession Real-Time Session Intent Detection Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "shap>=0.45.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "plotly>=5.18.0",
    "pydantic>=2.6.0",
    "joblib>=1.3.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "api*"]
exclude = ["frontend*", "tests*"]

[tool.vercel]
entrypoint = "api/index.py"
